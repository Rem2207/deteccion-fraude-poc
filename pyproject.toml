[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deteccion-fraude-poc"
version = "1.0.0"
description = "PoC reproducible de deteccion de fraude en pagos electronicos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3.1",
  "requests>=2.32,<3",
  "scikit-learn>=1.7,<1.9",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.2,<5",
  "nbclient>=0.10,<1",
  "pytest>=8.2,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
